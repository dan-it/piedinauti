# Production overrides: code is baked into the images, configuration comes
# from src/.env, and Caddy gets its own image containing the built assets.

services:
  app:
    build:
      target: prod
    env_file: ./src/.env
    environment:
      # Only this service runs database migrations at startup.
      RUN_MIGRATIONS: "true"
    volumes:
      - app_storage:/var/www/html/storage

  web:
    image: piedinauti-web
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: web

  queue:
    env_file: ./src/.env
    volumes:
      - app_storage:/var/www/html/storage

  scheduler:
    env_file: ./src/.env
    volumes:
      - app_storage:/var/www/html/storage

volumes:
  # Logs, sessions' files and cache shared by app, queue and scheduler.
  app_storage:
