# Builds the production images and publishes them to the GitHub Container Registry (ghcr.io).
#
# Runs on every push to the main branch (and on demand from the Actions tab). Each build is tagged with the
# short commit id (sha-1a2b3c4) and, for the main branch, also "latest". The server never compiles anything:
# scripts/aggiorna.sh does "git pull" and then downloads the images that belong to that same commit.
#
# Nothing to configure: it uses the repository's own GITHUB_TOKEN to publish. The images are private
# when the repository is private; the server logs in to ghcr.io with a read-only token (docs/PRODUZIONE.md).
name: Immagini

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# A newer push replaces a build that is still running for the same branch.
concurrency:
  group: immagini-${{ github.ref }}
  cancel-in-progress: true

jobs:
  costruisci:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Nomi delle immagini
        run: |
          # The registry wants lower-case names, whatever the case of the account name.
          echo "PROPRIETARIO=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          # Same rule as scripts/aggiorna.sh: the first 7 characters of the commit id.
          echo "SHA7=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Immagine dell'applicazione (PHP-FPM, scheduler e code)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: prod
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.PROPRIETARIO }}/piedinauti-app:sha-${{ env.SHA7 }}
            ghcr.io/${{ env.PROPRIETARIO }}/piedinauti-app:latest
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - name: Immagine web (Caddy con i file statici)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: web
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.PROPRIETARIO }}/piedinauti-web:sha-${{ env.SHA7 }}
            ghcr.io/${{ env.PROPRIETARIO }}/piedinauti-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Riepilogo
        run: |
          {
            echo "### Immagini pubblicate"
            echo
            echo "- \`ghcr.io/${PROPRIETARIO}/piedinauti-app:sha-${SHA7}\`"
            echo "- \`ghcr.io/${PROPRIETARIO}/piedinauti-web:sha-${SHA7}\`"
            echo
            echo "Sul server: \`./scripts/aggiorna.sh\` (fa il pull e scarica queste immagini)."
          } >> "$GITHUB_STEP_SUMMARY"
